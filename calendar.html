<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grind Grid — Calendar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;padding:2rem 1rem}
.container{max-width:1000px;margin:0 auto}
.nav{text-align:center;margin-bottom:1.5rem}
.nav a{color:#64748b;text-decoration:none;font-size:0.9rem}
.nav a:hover{color:#1e293b}
h1{font-size:1.75rem;font-weight:700;text-align:center}
.subtitle{text-align:center;color:#64748b;margin-bottom:0.5rem;font-size:0.9rem}
.subtitle strong{color:#1e293b}
.updated{text-align:center;color:#64748b;margin-bottom:1rem;font-size:0.8rem}
.error{text-align:center;padding:1rem;margin-bottom:1rem;color:#dc2626;background:#fef2f2;border-radius:8px;border:1px solid #fecaca}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:1rem;background:#fff;padding:12px 20px;border-radius:12px;border:1px solid #e2e8f0}
.toolbar-group{display:flex;align-items:center;gap:6px}
.toolbar h2{font-size:1.2rem;font-weight:600;min-width:10ch;text-align:center}
.btn{border:none;border-radius:6px;padding:7px 14px;font-size:0.9rem;font-family:inherit;font-weight:600;cursor:pointer}
.btn-primary{background:#4d96ff;color:#fff}
.btn-primary:hover{background:#3b7de6}
.btn-primary:disabled{background:#cbd5e1;cursor:default}
.btn-secondary{background:#f1f5f9;color:#1e293b}
.btn-secondary:hover{background:#e2e8f0}
.btn-arrow{padding:7px 12px;font-size:1rem;line-height:1}
.btn-danger{background:#fff;color:#dc2626;border:1px solid #fecaca}
.btn-danger:hover{background:#fef2f2}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;margin-bottom:1rem;font-size:0.8rem;color:#475569}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.calendar{background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.weekdays div{padding:8px 10px;font-size:0.75rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e2e8f0}
.cell{position:relative;min-height:104px;padding:6px 8px;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:background .12s}
.cell:nth-child(7n){border-right:none}
.cell:nth-last-child(-n+7){border-bottom:none}
.cell:hover{background:#f8fafc}
.cell:focus-visible{outline:2px solid #4d96ff;outline-offset:-2px}
.cell-head{display:flex;justify-content:space-between;align-items:center;gap:4px}
.day-num{font-size:0.85rem;font-weight:500;padding:1px 7px;margin-left:-4px;border-radius:999px;white-space:nowrap}
.other-month .day-num{color:#94a3b8}
.other-month .dots{opacity:.5}
.today .day-num{background:#4d96ff;color:#fff;font-weight:700}
.next-tag{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:#4d96ff;border-radius:4px;padding:1px 5px}
.meeting-time{font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meeting-upcoming{background:#e0ecff;box-shadow:inset 0 0 0 2px #4d96ff}
.meeting-upcoming:hover{background:#d4e4ff}
.meeting-upcoming .meeting-time{color:#1d4ed8}
.meeting-past{background:#f1f5f9}
.meeting-past:hover{background:#e9eef4}
.meeting-past .meeting-time{color:#64748b}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
#dotTip{position:fixed;z-index:1002;pointer-events:none;padding:6px 8px;background:rgba(0,0,0,0.8);border-radius:6px;color:#fff;font:bold 13px 'Courier New',Courier,monospace;white-space:nowrap}
#dotTip[hidden]{display:none}
#dayBox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;width:360px;max-width:calc(100vw - 2rem);background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;box-shadow:0 10px 30px rgba(15,23,42,.18)}
#dayBox[hidden]{display:none}
.day-box-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.day-title{font-size:1.05rem;font-weight:700}
.day-close{background:none;border:none;font-size:1.3rem;line-height:1;color:#64748b;cursor:pointer;padding:2px 6px;border-radius:6px}
.day-close:hover{background:#f1f5f9;color:#1e293b}
.section-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:6px}
.day-hours{list-style:none;margin-bottom:14px;font-size:0.9rem}
.day-hours li{display:flex;align-items:center;gap:8px;padding:3px 0}
.day-hours .hours{margin-left:auto;font:bold 13px 'Courier New',Courier,monospace}
.day-hours .none{color:#94a3b8}
.day-empty{color:#94a3b8;font-size:0.85rem;margin-bottom:14px}
.meeting-view{font-size:0.95rem;font-weight:600}
.meeting-form,.meeting-unlock{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.meeting-form[hidden],.meeting-unlock[hidden],.meeting-view[hidden]{display:none}
.meeting-form input,.meeting-unlock input{background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:0.9rem;font-family:inherit}
.meeting-form input:focus,.meeting-unlock input:focus{outline:none;border-color:#4d96ff}
.meeting-form input[type=date]{flex:1 1 140px}
.meeting-form input[type=time]{flex:1 1 90px}
.meeting-unlock input{flex:1;min-width:0}
.form-buttons{display:flex;gap:8px;width:100%}
.form-buttons .btn-primary{flex:1}
.day-status{min-height:1.2em;margin-top:8px;font-size:0.85rem;color:#64748b}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:1001;max-width:calc(100vw - 2rem);padding:8px 14px;background:#7f1d1d;border-radius:6px;color:#fff;font:bold 13px 'Courier New',Courier,monospace}
#toast[hidden]{display:none}
@media (max-width:640px){
  body{padding:1.5rem 1rem}
  .toolbar{padding:10px 12px;justify-content:center}
  .toolbar h2{order:-1;width:100%}
  .weekdays div{padding:6px 4px;font-size:0.65rem;text-align:center;letter-spacing:0}
  .cell{min-height:68px;padding:4px;gap:3px}
  .day-num{font-size:0.75rem;padding:0 5px;margin-left:0}
  .next-tag{display:none}
  .meeting-time{font-size:0.65rem}
  .meeting-time .clock{display:none}
  .dots{gap:3px}
  .cell .dot{width:7px;height:7px}
}
</style>
</head>
<body>
<div class="container">
<div class="nav"><a href="index.html">← Back to Charts</a></div>

<h1>📅 Calendar</h1>
<p class="subtitle" id="nextLine">Loading meetings…</p>
<p class="updated" id="updated"></p>

<div id="dataError"></div>

<div class="toolbar">
  <div class="toolbar-group">
    <button class="btn btn-secondary btn-arrow" id="prevMonth" aria-label="Previous month">‹</button>
    <button class="btn btn-secondary" id="todayBtn">Today</button>
    <button class="btn btn-secondary btn-arrow" id="nextMonth" aria-label="Next month">›</button>
  </div>
  <h2 id="monthTitle"></h2>
  <button class="btn btn-primary" id="nextMeetingBtn">Next meeting →</button>
</div>

<div class="legend" id="legend"></div>

<div class="calendar">
  <div class="weekdays" aria-hidden="true">
    <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
  </div>
  <div class="grid" id="grid"></div>
</div>
</div>

<script src="common.js"></script>
<script src="calendar.js"></script>
</body>
</html>
