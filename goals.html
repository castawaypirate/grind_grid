<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grind Grid — Goals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:2rem 1rem}
.container{max-width:760px;margin:0 auto}
.nav{text-align:center;margin-bottom:1.5rem}
.nav a{color:var(--muted);text-decoration:none;font-size:0.9rem}
.nav a:hover{color:var(--text)}
h1{font-size:1.75rem;font-weight:700;text-align:center}
.subtitle{text-align:center;color:var(--muted);margin-bottom:0.5rem;font-size:0.9rem}
.updated{text-align:center;color:var(--muted);margin-bottom:1.5rem;font-size:0.8rem}
.read-only{text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:1rem}
.read-only[hidden]{display:none}
.error{text-align:center;padding:2rem;color:var(--error-text);background:var(--error-bg);border-radius:8px;border:1px solid var(--error-border)}
.btn{border:none;border-radius:6px;padding:7px 14px;font-size:0.9rem;font-family:inherit;font-weight:600;cursor:pointer}
.btn:disabled{cursor:default;opacity:.55}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:not(:disabled):hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface-alt);color:var(--text)}
.btn-secondary:not(:disabled):hover{background:var(--surface-hover)}
.btn-danger{background:var(--surface);color:var(--error-text);border:1px solid var(--error-border)}
.btn-danger:not(:disabled):hover{background:var(--error-bg)}
.btn-small{padding:4px 10px;font-size:0.8rem}
.btn[hidden]{display:none}

.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.goal-card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.goal-user{font-size:1.15rem;font-weight:700}
.goal-habit{font-size:0.8rem;color:var(--muted);margin-top:2px}
.goal-row{display:block;width:100%;margin:0 0 6px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.goal-row:not(:disabled):hover{background:var(--surface-alt)}
.goal-row:disabled{cursor:default}
.goal-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.goal-row.empty{color:var(--faint);font-size:0.85rem;border-style:dashed}
.goal-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal-name{font-weight:600;font-size:0.95rem}
.goal-nums{font:bold 13px 'Courier New',Courier,monospace;color:var(--text-soft)}
.goal-bar{height:8px;margin:7px 0 6px;border-radius:999px;background:var(--surface-hover);overflow:hidden}
.goal-bar span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.goal-bar.reached span{background:var(--success)}
.goal-need{font-size:0.85rem;color:var(--text-soft)}
.goal-need strong{color:var(--text)}
.goal-need.reached{color:var(--success);font-weight:600}
.goal-was{color:var(--muted)}
.goal-was.up{color:var(--error-text)}
.goal-was.down{color:var(--success)}
.goal-need.out-of-reach{color:var(--error-text);font-weight:600}
.past-goals{margin-top:8px;font-size:0.85rem}
.past-goals summary{cursor:pointer;color:var(--muted);padding:4px 0}
.past-goals ul{list-style:none;margin-top:4px}
.past-goal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--border)}
.past-text{color:var(--text-soft)}
.past-text .goal-name{font-size:0.85rem;color:var(--text);margin-right:4px}
.met{color:var(--success);font-weight:600}
.missed{color:var(--error-text);font-weight:600}

#goalBox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;width:680px;max-width:calc(100vw - 2rem);max-height:calc(100vh - 2rem);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
#goalBox[hidden],.goal-body[hidden],.goal-unlock[hidden]{display:none}
.box-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.box-title{font-size:1.05rem;font-weight:700}
.box-close{background:none;border:none;font-size:1.3rem;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:6px}
.box-close:hover{background:var(--surface-alt);color:var(--text)}
.goal-tabs{display:flex;gap:4px;padding:3px;margin-bottom:14px;background:var(--surface-alt);border-radius:8px}
.goal-tab{flex:1;padding:6px;border:none;border-radius:6px;background:none;color:var(--muted);font:inherit;font-size:0.9rem;font-weight:600;cursor:pointer}
.goal-tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.goal-body{display:flex;flex-direction:column;gap:12px}
.goal-period{font-weight:700}
.goal-field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field-label{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.goal-field .field-label{min-width:7.5rem}
.date-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.goal-body input,.goal-unlock input{background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:0.9rem;font-family:inherit}
.goal-body input:focus,.goal-unlock input:focus{outline:none;border-color:var(--accent)}
.goal-sum{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.sum-part{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
.goal-logged{font-size:1.05rem}
.sum-caption{font-size:0.8rem;color:var(--muted)}
.op{font-weight:700;color:var(--muted)}
.duration{display:inline-flex;align-items:center;gap:3px}
.duration input{width:4.2rem;text-align:right}
.duration input[aria-label$="minutes"]{width:3.4rem}
.unit{color:var(--muted);font-size:0.85rem;margin-right:3px}
.goal-chips{display:flex;flex-wrap:wrap;gap:6px}
.goal-chips:empty{display:none}
.chip{padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface-alt);color:var(--text);font:inherit;font-size:0.8rem;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.best{border-color:var(--chart-monthly-goal)}
.chip.passed{color:var(--faint)}
.chip-note{font-size:0.75rem}
.goal-result{font-weight:600;color:var(--accent);min-height:1.2em}
.goal-result.invalid{color:var(--error-text)}
.form-buttons{display:flex;justify-content:flex-end;gap:8px}
/* Cancel then Save on the right; Delete, when there is one, on its own at the left. */
.form-buttons .btn-primary{order:2}
.form-buttons .btn-secondary{order:1}
.form-buttons .btn-danger{order:0;margin-right:auto}
.goal-unlock{display:flex;gap:8px}
.goal-unlock input{flex:1;min-width:0}
.goal-status{margin-top:10px;font-size:0.85rem;color:var(--muted)}
.goal-status:empty{display:none}
.custom-list{list-style:none}
.custom-list li{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
.custom-name{flex:1;font-size:0.9rem}
.goal-empty,.goal-hint{color:var(--faint);font-size:0.85rem}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:1001;max-width:calc(100vw - 2rem);padding:8px 14px;background:#7f1d1d;border-radius:6px;color:#fff;font:bold 13px 'Courier New',Courier,monospace}
#toast[hidden]{display:none}
/* The message after saving a goal: fades in at the bottom, fades out by itself. */
#goalToast{position:fixed;bottom:1.5rem;left:50%;z-index:1001;display:flex;flex-direction:column;gap:2px;width:max-content;max-width:calc(100vw - 2rem);padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;box-shadow:var(--shadow);color:var(--text);font-size:0.9rem;cursor:pointer;opacity:0;visibility:hidden;transform:translate(-50%,8px);transition:opacity .25s ease,transform .25s ease,visibility 0s linear .25s}
#goalToast.shown{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .25s ease,transform .25s ease,visibility 0s}
.toast-pace{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#goalToast,#goalToast.shown{transition:none}}
@media (max-width:640px){
  body{padding:1.5rem 1rem}
  .goal-field .field-label{min-width:0;width:100%}
}
</style>
</head>
<body>
<div class="container">
<div class="nav"><a href="index.html">← Back to Charts</a></div>

<h1>🎯 Goals</h1>
<p class="subtitle">Set a week, month or custom goal and see how much a day it takes</p>
<p class="updated" id="updated"></p>
<p class="read-only" id="readOnly" hidden>Read-only right now (can’t reach the server)</p>

<div id="goals"></div>
</div>

<script src="common.js"></script>
<script src="reminder.js"></script>
<script src="goals.js"></script>
</body>
</html>
