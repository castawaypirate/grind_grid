<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grind Grid — Challenge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
:root{--card-from:#fff;--card-to:#fff;--card-shadow:0 2px 10px rgba(15,23,42,.06);--rank1-from:#fffbeb;--rank1-to:#fff;--rank1-border:rgba(214,158,46,0.5);--rank2-border:rgba(148,163,184,0.6);--rank3-border:rgba(205,127,50,0.45);--gold:#b7791f;--silver:#64748b;--bronze:#a0522d;--track:#e2e8f0}
:root[data-theme="dark"]{--card-from:#1e1e2e;--card-to:#2a2a3e;--card-shadow:0 4px 20px rgba(0,0,0,0.3);--rank1-from:#1a1a2e;--rank1-to:#2a2a1e;--rank1-border:rgba(255,215,0,0.3);--rank2-border:rgba(192,192,192,0.2);--rank3-border:rgba(205,127,50,0.2);--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;--track:#333}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:2rem 1rem}
.container{max-width:900px;margin:0 auto}
.nav{text-align:center;margin-bottom:1.5rem}
.nav a{color:var(--muted);text-decoration:none;font-size:0.9rem}
.nav a:hover{color:var(--text)}
h1{font-size:1.75rem;font-weight:700;text-align:center}
.subtitle{text-align:center;color:var(--muted);margin-bottom:0.5rem;font-size:0.9rem}
.updated{text-align:center;color:var(--muted);margin-bottom:1rem;font-size:0.8rem}
.range-picker{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:1.5rem;background:var(--surface);padding:14px 20px;border-radius:12px;border:1px solid var(--border)}
.range-picker label{color:var(--muted);font-size:0.9rem;display:flex;align-items:center;gap:6px}
.range-picker input[type=date]{background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:0.9rem;font-family:inherit}
.range-picker input[type=date]:focus{outline:none;border-color:var(--accent)}
.range-picker button{background:var(--accent);color:white;border:none;border-radius:6px;padding:7px 18px;font-size:0.9rem;cursor:pointer;font-weight:600}
.range-picker button:hover{background:var(--accent-hover)}
.range-label{text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:1rem}
.leader-card{background:linear-gradient(135deg,var(--card-from),var(--card-to));border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--card-shadow)}
.leader-card.rank-1{border-color:var(--rank1-border);background:linear-gradient(135deg,var(--rank1-from),var(--rank1-to))}
.leader-card.rank-2{border-color:var(--rank2-border)}
.leader-card.rank-3{border-color:var(--rank3-border)}
.rank-row{display:flex;align-items:center;gap:14px}
.rank-badge{font-size:1.6rem;width:44px;text-align:center}
.rank-1 .rank-badge{font-size:2rem}
.player-info{flex:1}
.player-name{font-size:1.2rem;font-weight:600}
.rank-1 .player-name{color:var(--gold)}
.rank-2 .player-name{color:var(--silver)}
.rank-3 .player-name{color:var(--bronze)}
.player-habit{font-size:0.8rem;color:var(--muted);margin-top:2px}
.total-hours{font-size:1.8rem;font-weight:700;text-align:right;min-width:120px}
.total-hours small{font-size:0.8rem;font-weight:400;color:var(--muted)}
.progress-wrap{background:var(--track);height:10px;border-radius:8px;overflow:hidden;margin-top:8px}
.progress-bar{height:100%;border-radius:8px;transition:width 0.6s}
.achievement{margin-top:10px;font-size:0.9rem;padding:6px 12px;border-radius:8px;display:inline-block;color:var(--ach);background:color-mix(in srgb,var(--ach) 13%,transparent);border:1px solid color-mix(in srgb,var(--ach) 27%,transparent)}
:root[data-theme="light"] .achievement{color:color-mix(in srgb,var(--ach) 55%,#000);background:color-mix(in srgb,var(--ach) 18%,transparent);border-color:color-mix(in srgb,var(--ach) 50%,transparent)}
.study-days{font-size:0.85rem;color:var(--muted)}
.achievement-box{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:8px}
.error{text-align:center;padding:2rem;color:var(--error-text)}
</style>
</head>
<body>
<div class="container">
<div class="nav"><a href="index.html">← Back to Charts</a></div>

<h1 id="h1Title">🏆 Challenge</h1>
<p class="subtitle" id="subtitle">Ranked by total hours studied</p>
<p class="updated" id="updated"></p>

<div class="range-picker">
  <label>From <input type="date" id="dateFrom"></label>
  <span style="color:var(--divider)">→</span>
  <label>To <input type="date" id="dateTo"></label>
  <button id="applyBtn">Apply</button>
  <button id="latestBtn">Latest</button>
</div>

<div id="rangeLabel" class="range-label"></div>
<div id="leaderboard"></div>
</div>

<script src="common.js"></script>
<script src="reminder.js"></script>
<script>
const ACHIEVEMENTS = [
  { min: 500, label: '💎 LEGENDARY!', color: '#ff6b6b' },
  { min: 450, label: '🌟 GALAXIAN KING!', color: '#feca57' },
  { min: 400, label: '👑 SUPER SAIYAN KING!', color: '#ffd93d' },
  { min: 350, label: '🎖 DEFENDER!', color: '#6bcb77' },
  { min: 300, label: '🔥 MASTER!', color: '#ff6b6b' },
  { min: 250, label: '🏵 GENERAL!', color: '#4d96ff' },
  { min: 200, label: '⚔ WARRIOR!', color: '#ff9f43' },
  { min: 150, label: '🌿 OLYMPIAN!', color: '#1dd1a1' },
  { min: 100, label: '🥇 CHAMPION!', color: '#ffd700' },
  { min: 50,  label: '🥈 ELITE!', color: '#c0c0c0' },
  { min: 25,  label: '🥉 BEST OF YOUR TEAM!', color: '#cd7f32' },
  { min: 1,   label: '✨ TALENT!', color: '#a29bfe' }
];

const MEDALS = ['🥇', '🥈', '🥉'];

function getAchievement(total) {
  for (const a of ACHIEVEMENTS) {
    if (total >= a.min) return a;
  }
  return { label: '🌱 BEGINNER!', color: '#636e72' };
}

function render(startIdx, endIdx) {
  const users = jsonData.users;
  setChallengeTitle(startIdx, endIdx);

  const rangeLabel = document.getElementById('rangeLabel');
  rangeLabel.textContent = formatRangeLabel(idxToDate(startIdx), idxToDate(endIdx))
    + ' (' + (endIdx - startIdx + 1) + ' days)';

  const ranked = users.map(u => {
    const slice = sliceWithPadding(u.daily, startIdx, endIdx);
    const total = slice.reduce((a, b) => a + b, 0);
    const studyDays = slice.filter(v => v > 0).length;
    return { ...u, total, studyDays };
  }).sort((a, b) => b.total - a.total);

  const container = document.getElementById('leaderboard');
  container.innerHTML = '';

  ranked.forEach((user, i) => {
    const rank = i + 1;
    const medal = i < 3 ? MEDALS[i] : '#' + rank;
    const goalMax = ranked[0].total * 1.15 || 1;
    const pct = Math.min(100, (user.total / goalMax) * 100);
    const ach = getAchievement(user.total);

    const card = document.createElement('div');
    card.className = 'leader-card' + (rank <= 3 ? ' rank-' + rank : '');

    card.innerHTML = `
      <div class="rank-row">
        <div class="rank-badge">${medal}</div>
        <div class="player-info">
          <div class="player-name"></div>
          <div class="player-habit"></div>
        </div>
        <div class="total-hours">${user.total.toFixed(1)} <small>h</small></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" style="width:${pct}%;background:${ach.color}"></div>
      </div>
      <div class="achievement-box">
        <span class="achievement" style="--ach:${ach.color}">${ach.label}</span>
        <span class="study-days">${user.studyDays} study days</span>
      </div>
    `;
    card.querySelector('.player-name').textContent = user.displayName;
    card.querySelector('.player-habit').textContent = user.habitTitle;

    container.appendChild(card);
  });
}

// The years of the range being shown, e.g. "2026 Challenge".
function setChallengeTitle(startIdx, endIdx) {
  const startYear = idxToDate(startIdx).getUTCFullYear();
  const endYear = idxToDate(endIdx).getUTCFullYear();
  document.getElementById('h1Title').textContent = '🏆 ' +
    (startYear === endYear ? startYear : startYear + '–' + endYear) + ' Challenge';
}

document.addEventListener('DOMContentLoaded', () => initRangePage({
  render,
  errorEl: document.getElementById('leaderboard')
}));
</script>
</body>
</html>
