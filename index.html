<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grind Grid</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" crossorigin="anonymous"></script>
<link rel="stylesheet" href="notes.css">
<link rel="stylesheet" href="chart-tip.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:2rem 1rem}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.75rem;font-weight:700;margin-bottom:0.25rem;text-align:center}
.subtitle{text-align:center;color:var(--muted);margin-bottom:2rem;font-size:0.9rem}
.chart-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:2rem}
.chart-title{font-size:1.1rem;font-weight:600;margin-bottom:1rem;text-transform:capitalize}
/* Chart.js sizes the chart to this box, so it must hold only the canvas. */
.chart-box{position:relative;height:450px}
.chart-legend{display:flex;flex-wrap:nowrap;align-items:center;gap:4px 8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chart-legend label{display:inline-flex;align-items:center;gap:5px;padding:2px 5px;border-radius:6px;font-size:11px;color:var(--text-soft);cursor:pointer;user-select:none;white-space:nowrap;transition:opacity .15s,background .15s}
.chart-legend label:hover{background:var(--surface-alt)}
.chart-legend input{width:13px;height:13px;margin:0;cursor:pointer}
.chart-legend .legend-line{width:18px;height:0;flex:none;border-top:2px solid currentColor}
.chart-legend .legend-line.dashed{border-top-style:dashed}
.chart-legend label.off{opacity:.4}
.chart-legend label.off .legend-text{text-decoration:line-through}
.error{text-align:center;padding:2rem;color:var(--error-text);background:var(--error-bg);border-radius:8px;border:1px solid var(--error-border)}
.range-picker{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:1rem;background:var(--surface);padding:14px 20px;border-radius:12px;border:1px solid var(--border)}
.range-picker label{color:var(--muted);font-size:0.9rem;display:flex;align-items:center;gap:6px}
.range-picker input[type=date]{background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:0.9rem;font-family:inherit}
.range-picker input[type=date]:focus{outline:none;border-color:var(--accent)}
.range-picker button{background:var(--accent);color:white;border:none;border-radius:6px;padding:7px 18px;font-size:0.9rem;cursor:pointer;font-weight:600}
.range-picker button:hover{background:var(--accent-hover)}
.range-label{text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="container">
<h1>Grind Grid</h1>
<p class="subtitle">Habit tracking comparison</p>
<p style="text-align:center;margin-bottom:1rem;display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap">
  <a href="challenge.html" style="color:var(--muted);text-decoration:none;font-size:0.9rem">🏆 View Challenge Leaderboard →</a>
  <a href="1440-shots.html" style="color:var(--muted);text-decoration:none;font-size:0.9rem">⏳ View 1440 Shots →</a>
  <a href="calendar.html" style="color:var(--muted);text-decoration:none;font-size:0.9rem">📅 View Calendar →</a>
</p>
<div class="range-picker">
  <label>From <input type="date" id="dateFrom"></label>
  <span style="color:var(--divider)">→</span>
  <label>To <input type="date" id="dateTo"></label>
  <button id="applyBtn">Apply</button>
  <button id="latestBtn">Latest</button>
  <label><input type="checkbox" id="notesToggle"> Notes</label>
</div>
<div id="rangeLabel" class="range-label"></div>
<div id="charts"></div>
</div>
<script src="common.js"></script>
<script src="reminder.js"></script>
<script src="notes.js"></script>
<script src="chart-tip.js"></script>
<script>
function daysInMonth(d) {
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
}

function renderChart(canvas, labels, data, goals, legendEl, user, startIdx) {
  // Only the daily goal is set (data.json); the week's and each month's goal are that many hours a day.
  const weeklyGoal = goals.daily * 7;
  const monthlyGoal = labels.map((_, i) => goals.daily * daysInMonth(idxToDate(startIdx + i)));
  const chart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Daily Hours',
          data: data.daily,
          ...themed({ borderColor: '--chart-daily', backgroundColor: '--chart-daily-fill' }),
          fill: true,
          tension: 0.12,
          ...noteDotOptions(user.username, startIdx, 1.5, 4)
        },
        {
          label: 'Daily Goal (' + goals.daily + 'h)',
          data: new Array(labels.length).fill(goals.daily),
          ...themed({ borderColor: '--chart-ink' }),
          backgroundColor: 'rgba(218,165,32,0.06)',
          fill: false,
          pointRadius: 0,
          tension: 0
        },
        {
          label: 'Weekly Hours',
          data: data.weeklyLine,
          ...themed({ borderColor: '--chart-weekly' }),
          backgroundColor: 'rgba(39,174,96,0.06)',
          fill: false,
          tension: 0.12,
          pointRadius: 0
        },
        {
          label: 'Weekly Goal (' + weeklyGoal + 'h)',
          data: new Array(labels.length).fill(weeklyGoal),
          ...themed({ borderColor: '--chart-weekly-goal' }),
          backgroundColor: 'rgba(218,165,32,0.06)',
          fill: false,
          pointRadius: 0,
          tension: 0
        },
        {
          label: 'Monthly Hours',
          data: data.monthlyLine,
          ...themed({ borderColor: '--chart-monthly' }),
          backgroundColor: 'rgba(142,68,173,0.06)',
          fill: false,
          tension: 0.12,
          pointRadius: 0
        },
        {
          label: 'Monthly Goal (' + goals.daily + 'h × days)',
          data: monthlyGoal,
          ...themed({ borderColor: '--chart-monthly-goal' }),
          backgroundColor: 'rgba(218,165,32,0.06)',
          fill: false,
          pointRadius: 0,
          // Steps up or down on the 1st, rather than sloping across the month's last day.
          stepped: true
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        tooltip: {
          mode: 'index',
          intersect: false,
          enabled: false,
          external: chartTipHandler(user, startIdx, (date, i) => [
            { dataset: 0, name: 'Daily', hours: data.daily[i], goal: goals.daily, track: true },
            // The lines show each week's and month's total; the label shows how far along that day was.
            {
              dataset: 2, name: 'Week ' + isoWeek(date), hours: data.weekSoFar[i], goal: weeklyGoal, track: true,
              total: data.weeklyLine[i], totalLabel: data.weekDone[i] ? 'Week total' : 'Week total so far'
            },
            {
              dataset: 4, name: date.toLocaleDateString('en-GB', { month: 'long', timeZone: 'UTC' }), hours: data.monthSoFar[i], goal: monthlyGoal[i], track: true,
              total: data.monthlyLine[i], totalLabel: data.monthDone[i] ? 'Month total' : 'Month total so far'
            }
          ])
        },
        legend: {
          display: false
        }
      },
      scales: {
        x: {
          ticks: { maxTicksLimit: 25, font: { size: 10 } }
        },
        y: {
          title: { display: true, text: 'Hours' },
          beginAtZero: true
        }
      }
    }
  });

  activeCharts.push(chart);
  attachNotes(chart, canvas, user, startIdx);
  renderLegend(chart, legendEl);
}

// For one period length (weeks from Monday, or months from the 1st), per day:
//   soFar: the period's hours up to and including that day
//   total: the period's whole total (what the chart line shows), so far for the period still running
//   done:  whether that period has ended
// Worked out over all the data, so a range starting mid-period still counts the days before it.
function periodTotals(daily, startsPeriod) {
  const last = daily.length - 1;
  const soFar = [];
  let sum = 0;
  daily.forEach((hours, i) => {
    if (startsPeriod(idxToDate(i))) sum = 0;
    sum += hours;
    soFar.push(+sum.toFixed(2));
  });
  // Each period's last day holds its total; walk back to give it to the period's other days.
  const total = [];
  const done = [];
  for (let i = last; i >= 0; i--) {
    const endsPeriod = i === last || startsPeriod(idxToDate(i + 1));
    total[i] = endsPeriod ? soFar[i] : total[i + 1];
    done[i] = endsPeriod ? startsPeriod(idxToDate(i + 1)) : done[i + 1];
  }
  return { soFar, total, done };
}

const startsWeek = d => d.getUTCDay() === 1;
const startsMonth = d => d.getUTCDate() === 1;

function render(startIdx, endIdx) {
  const users = jsonData.users;
  const goals = jsonData.goals;
  const labels = [];
  for (let i = startIdx; i <= endIdx; i++) {
    labels.push(formatChartLabel(idxToDate(i)));
  }

  document.getElementById('rangeLabel').textContent =
    formatRangeLabel(idxToDate(startIdx), idxToDate(endIdx))
    + ' (' + (endIdx - startIdx + 1) + ' days)';

  destroyCharts();
  const container = document.getElementById('charts');
  container.innerHTML = '';

  for (const user of users) {
    const wrapper = document.createElement('div');
    wrapper.className = 'chart-wrapper';

    const title = document.createElement('div');
    title.className = 'chart-title';
    title.textContent = user.displayName + ' \u2014 ' + user.habitTitle;
    wrapper.appendChild(title);

    const legend = document.createElement('div');
    legend.className = 'chart-legend';
    wrapper.appendChild(legend);

    const box = document.createElement('div');
    box.className = 'chart-box';
    const canvas = document.createElement('canvas');
    box.appendChild(canvas);
    wrapper.appendChild(box);
    container.appendChild(wrapper);

    const week = periodTotals(user.daily, startsWeek);
    const month = periodTotals(user.daily, startsMonth);
    const slice = arr => sliceWithPadding(arr, startIdx, endIdx);
    renderChart(canvas, labels, {
      daily: slice(user.daily),
      weeklyLine: slice(week.total),
      monthlyLine: slice(month.total),
      weekSoFar: slice(week.soFar),
      monthSoFar: slice(month.soFar),
      weekDone: slice(week.done),
      monthDone: slice(month.done)
    }, goals, legend, user, startIdx);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initNotes();
  initRangePage({ render, errorEl: document.getElementById('charts') });
});
</script>
</body>
</html>
