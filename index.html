<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grind Grid</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;padding:2rem 1rem}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.75rem;font-weight:700;margin-bottom:0.25rem;text-align:center}
.subtitle{text-align:center;color:#64748b;margin-bottom:2rem;font-size:0.9rem}
.chart-wrapper{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1.5rem;margin-bottom:2rem}
.chart-title{font-size:1.1rem;font-weight:600;margin-bottom:1rem;text-transform:capitalize}
.chart-wrapper canvas{width:100%!important;height:450px!important}
.chart-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-bottom:12px}
.chart-legend label{display:inline-flex;align-items:center;gap:7px;padding:3px 7px;border-radius:6px;font-size:12px;color:#475569;cursor:pointer;user-select:none;transition:opacity .15s,background .15s}
.chart-legend label:hover{background:#f1f5f9}
.chart-legend input{width:14px;height:14px;margin:0;cursor:pointer}
.chart-legend .legend-line{width:22px;height:0;flex:none;border-top:2px solid currentColor}
.chart-legend .legend-line.dashed{border-top-style:dashed}
.chart-legend label.off{opacity:.4}
.chart-legend label.off .legend-text{text-decoration:line-through}
.error{text-align:center;padding:2rem;color:#dc2626;background:#fef2f2;border-radius:8px;border:1px solid #fecaca}
.range-picker{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:1rem;background:#fff;padding:14px 20px;border-radius:12px;border:1px solid #e2e8f0}
.range-picker label{color:#64748b;font-size:0.9rem;display:flex;align-items:center;gap:6px}
.range-picker input[type=date]{background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:0.9rem;font-family:inherit}
.range-picker input[type=date]:focus{outline:none;border-color:#4d96ff}
.range-picker button{background:#4d96ff;color:white;border:none;border-radius:6px;padding:7px 18px;font-size:0.9rem;cursor:pointer;font-weight:600}
.range-picker button:hover{background:#3b7de6}
.range-label{text-align:center;color:#64748b;font-size:0.85rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="container">
<h1>Grind Grid</h1>
<p class="subtitle">Habit tracking comparison</p>
<p style="text-align:center;margin-bottom:1rem;display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap">
  <a href="challenge.html" style="color:#64748b;text-decoration:none;font-size:0.9rem">⚔ View Challenge Leaderboard →</a>
  <a href="1440-shots.html" style="color:#64748b;text-decoration:none;font-size:0.9rem">⏱ View 1440 Shots →</a>
</p>
<div class="range-picker">
  <label>From <input type="date" id="dateFrom"></label>
  <span style="color:#cbd5e1">→</span>
  <label>To <input type="date" id="dateTo"></label>
  <button id="updateBtn">Update</button>
</div>
<div id="rangeLabel" class="range-label"></div>
<div id="charts"></div>
</div>
<script>
const DAY_MS = 86400000;
const STORAGE_KEY = 'grindgrid.dateRange';
let DATA_START = null;
let jsonData = null;

function toDateStr(d) {
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}

function idxToDate(i) {
  return new Date(DATA_START.getTime() + i * DAY_MS);
}

function formatChartLabel(d) {
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

function formatRangeLabel(start, end) {
  const startText = formatChartLabel(start);
  const endText = formatChartLabel(end);
  if (start.getUTCFullYear() === end.getUTCFullYear()) {
    return startText.replace(/ \d{4}$/, '') + ' – ' + endText;
  }
  return startText + ' – ' + endText;
}

function sliceWithPadding(arr, startIdx, endIdx) {
  const out = [];
  for (let i = startIdx; i <= endIdx; i++) {
    out.push(i >= 0 && i < arr.length ? arr[i] : 0);
  }
  return out;
}

function loadSavedRange() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && /^\d{4}-\d{2}-\d{2}$/.test(saved.from) && /^\d{4}-\d{2}-\d{2}$/.test(saved.to)) {
      return saved;
    }
  } catch (e) {}
  return null;
}

function saveRange(from, to) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ from, to }));
  } catch (e) {}
}

function formatDuration(mins) {
  const total = Math.round(mins);
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (h === 0) return m + ' min';
  if (m === 0) return h + 'h';
  return h + 'h ' + m + ' min';
}

function renderLegend(chart, legendEl) {
  legendEl.innerHTML = '';

  chart.data.datasets.forEach((dataset, i) => {
    const item = document.createElement('label');

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = true;
    checkbox.style.accentColor = dataset.borderColor;

    const line = document.createElement('span');
    line.className = 'legend-line' + (dataset.borderDash ? ' dashed' : '');
    line.style.borderTopColor = dataset.borderColor;

    const text = document.createElement('span');
    text.className = 'legend-text';
    text.textContent = dataset.label;

    checkbox.addEventListener('change', () => {
      chart.setDatasetVisibility(i, checkbox.checked);
      chart.update();
      item.classList.toggle('off', !checkbox.checked);
    });

    item.append(checkbox, line, text);
    legendEl.appendChild(item);
  });
}

function renderChart(canvas, labels, data, goals, legendEl) {
  const chart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Daily Hours',
          data: data.daily,
          borderColor: '#2c3e50',
          backgroundColor: 'rgba(44,62,80,0.10)',
          fill: true,
          tension: 0.12,
          pointRadius: 1.5
        },
        {
          label: 'Daily Goal (' + goals.daily + 'h)',
          data: new Array(labels.length).fill(goals.daily),
          borderColor: 'black',
          backgroundColor: 'rgba(218,165,32,0.06)',
          fill: false,
          pointRadius: 0,
          tension: 0
        },
        {
          label: 'Weekly Hours',
          data: data.weeklyLine,
          borderColor: '#27ae60',
          backgroundColor: 'rgba(39,174,96,0.06)',
          fill: false,
          tension: 0.12,
          pointRadius: 0
        },
        {
          label: 'Weekly Goal (' + goals.weekly + 'h)',
          data: new Array(labels.length).fill(goals.weekly),
          borderColor: 'black',
          backgroundColor: 'rgba(218,165,32,0.06)',
          fill: false,
          pointRadius: 0,
          tension: 0
        },
        {
          label: 'Monthly Hours',
          data: data.monthlyLine,
          borderColor: '#8e44ad',
          backgroundColor: 'rgba(142,68,173,0.06)',
          fill: false,
          tension: 0.12,
          pointRadius: 0
        },
        {
          label: 'Monthly Goal (' + goals.monthly + 'h)',
          data: new Array(labels.length).fill(goals.monthly),
          borderColor: 'gold',
          backgroundColor: 'rgba(218,165,32,0.06)',
          fill: false,
          pointRadius: 0,
          tension: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        tooltip: {
          mode: 'index',
          intersect: false,
          titleFont: { family: "'Courier New', Courier, monospace", size: 13, weight: 'bold' },
          bodyFont: { family: "'Courier New', Courier, monospace", size: 13, weight: 'bold' },
          footerFont: { family: "'Courier New', Courier, monospace", size: 13, weight: 'bold' },
          callbacks: {
            label: function(ctx) {
              return ctx.dataset.label + ': ' + formatDuration(ctx.parsed.y * 60);
            }
          }
        },
        legend: {
          display: false
        }
      },
      scales: {
        x: {
          ticks: { maxTicksLimit: 25, font: { size: 10 } }
        },
        y: {
          title: { display: true, text: 'Hours' },
          beginAtZero: true
        }
      }
    }
  });

  renderLegend(chart, legendEl);
}

function render(startIdx, endIdx) {
  const users = jsonData.users;
  const goals = jsonData.goals;
  const labels = [];
  for (let i = startIdx; i <= endIdx; i++) {
    labels.push(formatChartLabel(idxToDate(i)));
  }

  document.getElementById('rangeLabel').textContent =
    formatRangeLabel(idxToDate(startIdx), idxToDate(endIdx))
    + ' (' + (endIdx - startIdx + 1) + ' days)';

  const container = document.getElementById('charts');
  container.innerHTML = '';

  for (const user of users) {
    const wrapper = document.createElement('div');
    wrapper.className = 'chart-wrapper';

    const title = document.createElement('div');
    title.className = 'chart-title';
    title.textContent = user.displayName + ' \u2014 ' + user.habitTitle;
    wrapper.appendChild(title);

    const legend = document.createElement('div');
    legend.className = 'chart-legend';
    wrapper.appendChild(legend);

    const canvas = document.createElement('canvas');
    wrapper.appendChild(canvas);
    container.appendChild(wrapper);

    renderChart(canvas, labels, {
      daily: sliceWithPadding(user.daily, startIdx, endIdx),
      weeklyLine: sliceWithPadding(user.weeklyLine, startIdx, endIdx),
      monthlyLine: sliceWithPadding(user.monthlyLine, startIdx, endIdx)
    }, goals, legend);
  }
}

function update() {
  const dateFrom = new Date(document.getElementById('dateFrom').value + 'T00:00:00Z');
  const dateTo = new Date(document.getElementById('dateTo').value + 'T00:00:00Z');

  if (isNaN(dateFrom) || isNaN(dateTo)) return;

  let startIdx = Math.round((dateFrom - DATA_START) / DAY_MS);
  let endIdx = Math.round((dateTo - DATA_START) / DAY_MS);

  if (startIdx > endIdx) {
    const tmp = startIdx;
    startIdx = endIdx;
    endIdx = tmp;
  }

  // Future dates still stop at the latest available data point.
  endIdx = Math.min(endIdx, jsonData.labels.length - 1);
  startIdx = Math.min(startIdx, endIdx);

  const from = toDateStr(idxToDate(startIdx));
  const to = toDateStr(idxToDate(endIdx));
  document.getElementById('dateFrom').value = from;
  document.getElementById('dateTo').value = to;
  saveRange(from, to);

  render(startIdx, endIdx);
}

async function init() {
  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error('Failed to load data.json');
    jsonData = await res.json();

    if (!jsonData.startDate) throw new Error('data.json is missing startDate');
    DATA_START = new Date(jsonData.startDate + 'T00:00:00Z');

    const lastIdx = jsonData.labels.length - 1;
    const fromInput = document.getElementById('dateFrom');
    const toInput = document.getElementById('dateTo');

    fromInput.max = toDateStr(idxToDate(lastIdx));
    toInput.max = toDateStr(idxToDate(lastIdx));

    const saved = loadSavedRange();
    fromInput.value = saved ? saved.from : toDateStr(DATA_START);
    toInput.value = saved ? saved.to : toDateStr(idxToDate(lastIdx));

    update();

    document.getElementById('updateBtn').addEventListener('click', update);
  } catch (err) {
    document.getElementById('charts').innerHTML = '<div class="error">' + err.message + '</div>';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
